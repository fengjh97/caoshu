<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>草書 · 入墨</title>
<meta name="description" content="草书认字与手写练习 · FSRS 间隔重复 · 一千常用字">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="草書">
<meta name="theme-color" content="#f3ecdd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/LiuJianMaoCao-sub.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- 氛围层：宣纸纹理 + 墨晕 + 幽灵巨字 -->
<div id="atmo" aria-hidden="true">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div id="ghost-glyph" class="ghost-glyph">書</div>
  <div class="grain"></div>
</div>

<div id="app">

  <!-- ================= 今日 ================= -->
  <main id="view-today" class="view">
    <div class="home-grid">
      <div class="home-main">
        <p class="date-line reveal" style="--i:0"><span id="home-date">…</span><span id="home-streak" class="streak-chip hidden">连 0 天</span></p>

        <div class="ring-block reveal" style="--i:1">
          <svg class="ring" viewBox="0 0 200 200">
            <circle class="ring-track" cx="100" cy="100" r="86"/>
            <circle id="ring-fill" class="ring-fill" cx="100" cy="100" r="86"/>
          </svg>
          <div class="ring-center">
            <div id="ring-num" class="ring-num">–</div>
            <div id="ring-sub" class="ring-sub">今日待练</div>
          </div>
        </div>

        <div class="stat-chips reveal" style="--i:2">
          <span class="chip"><b id="chip-new">0</b> 新学</span>
          <span class="chip-sep">·</span>
          <span class="chip"><b id="chip-review">0</b> 复习</span>
        </div>

        <button id="btn-start" class="btn-primary reveal" style="--i:3" disabled>
          <span class="btn-ink-word">入墨</span><span class="btn-rest">开始练习</span>
        </button>
        <p id="home-note" class="mode-note reveal" style="--i:4"></p>
      </div>

      <div class="v-title-col" aria-hidden="true">
        <div class="v-title brush-reveal">草書</div>
        <div class="v-seal">入墨</div>
      </div>
    </div>
  </main>

  <!-- ================= 认字 ================= -->
  <main id="view-recognize" class="view hidden">
    <header class="page-head">
      <h1>认字</h1>
      <span id="quiz-tally" class="streak-chip hidden">0 / 0</span>
    </header>
    <p class="page-sub">自由练 · 不影响复习排期</p>
    <section id="quiz-body"></section>
  </main>

  <!-- ================= 拆解 ================= -->
  <main id="view-decomp" class="view hidden">
    <div id="decomp-index">
      <header class="page-head"><h1>拆解</h1><span class="page-count" id="lib-count"></span></header>
      <input id="decomp-search" class="field" type="search" placeholder="搜字 · 拼音" autocomplete="off">
      <div class="filter-row">
        <button class="filter-pill active" data-filter="core">学习字表</button>
        <button class="filter-pill" data-filter="all">全部三千字</button>
      </div>
      <div id="char-grid" class="char-grid"></div>
    </div>
    <div id="decomp-detail" class="hidden"></div>
  </main>

  <!-- ================= 进度 ================= -->
  <main id="view-progress" class="view hidden">
    <header class="page-head"><h1>进度</h1></header>
    <section id="progress-body"></section>
  </main>

  <!-- ================= 设置 ================= -->
  <main id="view-settings" class="view hidden">
    <header class="page-head"><h1>设置</h1></header>
    <section id="settings-body"></section>
  </main>

</div>

<!-- ================= 练习：全屏沉浸层（入墨） ================= -->
<div id="study" class="study hidden" role="dialog" aria-label="练习">
  <header class="study-head">
    <button id="btn-exit-study" class="ghost-btn" aria-label="退出">✕</button>
    <div class="study-line"><div id="study-line-fill"></div></div>
    <span id="study-count" class="study-count">0/0</span>
  </header>
  <section id="study-stage" class="study-stage"></section>
</div>

<nav id="dock" aria-label="主导航">
  <button class="dock-item active" data-view="today"><span class="dock-glyph">今</span><span class="dock-label">今日</span></button>
  <button class="dock-item" data-view="recognize"><span class="dock-glyph">认</span><span class="dock-label">认字</span></button>
  <button class="dock-item" data-view="decomp"><span class="dock-glyph">拆</span><span class="dock-label">拆解</span></button>
  <button class="dock-item" data-view="progress"><span class="dock-glyph">进</span><span class="dock-label">进度</span></button>
  <button class="dock-item" data-view="settings"><span class="dock-glyph">设</span><span class="dock-label">设置</span></button>
</nav>

<script src="js/config.js"></script>
<script src="js/fsrs.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
