<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>學書</title>
<meta name="description" content="草書認字與手寫練習 · 每日一句 · 唐詩三百首 · FSRS 間隔重複">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="學書">
<meta name="theme-color" content="#f3ecdd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/LiuJianMaoCao-sub.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-tc-webfont@1.7.0/style.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="font-ext.css">
</head>
<body>

<!-- 氛圍層：宣紙紋理 + 墨暈 + 幽靈巨字 -->
<div id="atmo" aria-hidden="true">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div id="ghost-glyph" class="ghost-glyph">書</div>
  <div class="grain"></div>
</div>

<div id="app">

  <!-- ================= 今日（單屏不滾動） ================= -->
  <main id="view-today" class="view view-home">
    <p class="date-line reveal" style="--i:0"><span id="home-date">…</span><span id="home-streak" class="streak-chip hidden">連 0 天</span></p>

    <div class="home-top">
      <div class="home-main reveal" style="--i:1">
        <div class="ring-block">
          <svg class="ring" viewBox="0 0 200 200">
            <circle class="ring-track" cx="100" cy="100" r="86"/>
            <circle id="ring-fill" class="ring-fill" cx="100" cy="100" r="86"/>
          </svg>
          <div class="ring-center">
            <div id="ring-num" class="ring-num">–</div>
            <div id="ring-sub" class="ring-sub">今日待練</div>
          </div>
        </div>
        <div class="stat-chips">
          <span class="chip"><b id="chip-new">0</b> 新學</span>
          <span class="chip-sep">·</span>
          <span class="chip"><b id="chip-review">0</b> 複習</span>
        </div>
      </div>

      <div class="v-title-col" aria-hidden="true">
        <!-- 「學」王羲之《學書帖》 · 「書」歐陽詢《卜商帖》 -->
        <div class="v-title brush-reveal">
          <img class="vt-glyph vt-xue" src="img/title-xue.png" alt="學">
          <img class="vt-glyph vt-shu" src="img/title-shu.png" alt="書">
        </div>
        <div class="v-seal">入墨</div>
      </div>
    </div>

    <!-- 今日文句：自寫短句 / 唐詩選句 -->
    <section id="daily-block" class="reveal" style="--i:2"></section>

    <div class="home-foot reveal" style="--i:3">
      <button id="btn-start" class="btn-primary" disabled>
        <span class="btn-ink-word">入墨</span><span class="btn-rest">開始練習</span>
      </button>
      <p id="home-note" class="mode-note"></p>
    </div>
  </main>

  <!-- ================= 複習 ================= -->
  <main id="view-review" class="view hidden">
    <header class="page-head">
      <h1>複習</h1>
      <span id="quiz-tally" class="streak-chip hidden">0 / 0</span>
    </header>
    <p class="page-sub">學過的字 · 認一認，再寫一寫</p>
    <section id="review-body"></section>
  </main>

  <!-- ================= 字庫 ================= -->
  <main id="view-decomp" class="view hidden">
    <div id="decomp-index">
      <header class="page-head"><h1>字庫</h1><span class="page-count" id="lib-count"></span></header>
      <input id="decomp-search" class="field" type="search" placeholder="搜字 · 拼音" autocomplete="off">
      <div class="filter-row">
        <button class="filter-pill active" data-filter="core">學習字表</button>
        <button class="filter-pill" data-filter="all">全部字庫</button>
      </div>
      <div id="char-grid" class="char-grid"></div>
    </div>
    <div id="decomp-detail" class="hidden"></div>
  </main>

  <!-- ================= 進度 ================= -->
  <main id="view-progress" class="view hidden">
    <header class="page-head"><h1>進度</h1></header>
    <section id="progress-body"></section>
  </main>

  <!-- ================= 設置 ================= -->
  <main id="view-settings" class="view hidden">
    <header class="page-head"><h1>設置</h1></header>
    <section id="settings-body"></section>
  </main>

</div>

<!-- ================= 唐詩選句層 ================= -->
<div id="poem-sheet" class="poem-sheet hidden" role="dialog" aria-label="唐詩選句">
  <div class="poem-sheet-inner">
    <header class="poem-head">
      <button id="poem-close" class="ghost-btn" aria-label="關閉">✕</button>
      <h2>唐詩三百首 · 選句入課</h2>
    </header>
    <input id="poem-search" class="field" type="search" placeholder="搜詩題 · 作者 · 詩句" autocomplete="off">
    <div id="poem-body"></div>
  </div>
</div>

<!-- ================= 練習：全屏沉浸層（入墨） ================= -->
<div id="study" class="study hidden" role="dialog" aria-label="練習">
  <header class="study-head">
    <button id="btn-exit-study" class="ghost-btn" aria-label="退出">✕</button>
    <div class="study-line"><div id="study-line-fill"></div></div>
    <span id="study-count" class="study-count">0/0</span>
  </header>
  <section id="study-stage" class="study-stage"></section>
</div>

<nav id="dock" aria-label="主導航">
  <button class="dock-item active" data-view="today"><span class="dock-glyph">今</span><span class="dock-label">今日</span></button>
  <button class="dock-item" data-view="review"><span class="dock-glyph">復</span><span class="dock-label">複習</span></button>
  <button class="dock-item" data-view="decomp"><span class="dock-glyph">庫</span><span class="dock-label">字庫</span></button>
  <button class="dock-item" data-view="progress"><span class="dock-glyph">進</span><span class="dock-label">進度</span></button>
  <button class="dock-item" data-view="settings"><span class="dock-glyph">設</span><span class="dock-label">設置</span></button>
</nav>

<script src="js/config.js"></script>
<script src="js/fx.js"></script>
<script src="js/fsrs.js"></script>
<script src="js/brush.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
